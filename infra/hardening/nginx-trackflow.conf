# Reverse proxy TLS de TrackFlow (auditoría OWASP A02 "TLS en rutas al
# cliente" + A05; ver Pasos/owasp-auditoria-hardening.md).
#
# Es la ÚNICA puerta pública (80/443 en ufw). Los servicios quedan en
# 127.0.0.1 (Docker con "ip": "127.0.0.1", ver provision.sh) y solo se
# alcanzan a través de aquí.
#
# Instalar: /etc/nginx/sites-available/trackflow.conf + symlink en sites-enabled,
# cambiar server_name y las rutas del certificado (p. ej. certbot --nginx).

# Formato de log sin query string (el ?token= del WebSocket no debe quedar en disco).
log_format trackflow_no_query '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name trackflow.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # "listen ... http2" (no "http2 on;"): nginx 1.24 de Ubuntu 24.04 no conoce
    # la directiva nueva (>= 1.25.1). Validado con `nginx -t` en ubuntu:24.04.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trackflow.example.com;

    ssl_certificate     /etc/letsencrypt/live/trackflow.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trackflow.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 20m;  # PDF de RFP

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Backoffice (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # incidents-api. /rfp/events es SSE (Hito 10 Parte 1): sin buffering y con
    # timeout de lectura mayor que el keep-alive de 15 s del servidor.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # knowledge-api. /chat/ws es WebSocket (Hito 10 Parte 2): upgrade explícito.
    # Ojo: el JWT viaja en ?token= -- no registrar la query string en el access log.
    location /agent-api/ {
        proxy_pass http://127.0.0.1:8020/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
        access_log /var/log/nginx/trackflow-agent.log trackflow_no_query;
    }
}
