services:
  uis:
    build:
      context: ./uis
      dockerfile: Dockerfile
    working_dir: /app
    command: >
      sh -c "cd /app/website && npm run dev -- --hostname 0.0.0.0 --port 3000 &
      cd /app/backoffice && npm run dev -- --hostname 0.0.0.0 --port 3001 &
      wait"
    volumes:
      - ./uis:/app
      - /app/website/node_modules
      - /app/backoffice/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      - backend
    networks:
      - trackflow_network

  backend:
    build:
      context: ./services
      dockerfile: Dockerfile
    working_dir: /app/services/incidents-api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/app
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - redis
    networks:
      - trackflow_network

  # Ejecuta la tarea Celery (tasks.analyze_incidents_csv) como proceso
  # independiente del servidor de la API -- nunca dentro del proceso de
  # FastAPI (sin APScheduler/@repeat_every/lifespan). Mismo codigo que
  # "backend" (misma imagen), pero corriendo `celery worker` en vez de
  # `uvicorn`.
  worker:
    build:
      context: ./services
      dockerfile: Dockerfile
    working_dir: /app/services/incidents-api
    command: celery -A celery_app worker --loglevel=info
    volumes:
      - ./:/app
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - trackflow_network

  redis:
    image: redis:7-alpine
    # noeviction: si se llega a maxmemory, Redis rechaza escrituras nuevas
    # en vez de descartar claves en silencio -- para un broker de tareas,
    # perder un mensaje encolado sin avisar es peor que un error explicito.
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    networks:
      - trackflow_network

  # Monitoreo de Celery (tareas encoladas/en proceso/completadas, workers
  # activos). Apunta al mismo broker que "backend" y "worker".
  flower:
    image: mher/flower:2.0
    # --broker va antes del subcomando "flower" (flags de celery, no de
    # flower) -- si va despues, la imagen lo ignora en silencio y flower
    # cae al broker por defecto (amqp://guest@localhost), verificado con un
    # contenedor real (ver Pasos/incidents-analyze-celery-redis.md).
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
    networks:
      - trackflow_network

  reporting:
    build:
      context: .
      dockerfile: services/reporting/Dockerfile
    working_dir: /app/services/reporting
    command: uvicorn main:app --host 0.0.0.0 --port 8010 --reload
    volumes:
      - ./data/pipelines/exec_weekly_inventory_kpis:/app/data/pipelines/exec_weekly_inventory_kpis
      - ./services/reporting:/app/services/reporting
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "8010:8010"
    networks:
      - trackflow_network

  # Base vectorial del RAG (CONTEXT7.md, Hito 7). Coleccion "trackflow_knowledge",
  # creada/poblada por data/process/rag.py:setup(). Alternativa a Qdrant Cloud
  # mencionada en la guia -- este servicio es para desarrollo local.
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333" # REST + dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - trackflow_network

  # Fase 3 del RAG: POST /knowledge/query. Capa HTTP fina sobre
  # data/pipelines/rag.py::query() -- no duplica logica de recuperacion/generacion.
  knowledge-api:
    build:
      context: .
      dockerfile: services/knowledge-api/Dockerfile
    working_dir: /app/services/knowledge-api
    command: uvicorn main:app --host 0.0.0.0 --port 8020 --reload
    volumes:
      - ./data/process/rag.py:/app/data/process/rag.py
      - ./data/pipelines/rag.py:/app/data/pipelines/rag.py
      - ./services/knowledge-api:/app/services/knowledge-api
    environment:
      PYTHONUNBUFFERED: "1"
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8020:8020"
    depends_on:
      - qdrant
    networks:
      - trackflow_network

networks:
  trackflow_network:
    name: trackflow_network

volumes:
  qdrant_storage:
