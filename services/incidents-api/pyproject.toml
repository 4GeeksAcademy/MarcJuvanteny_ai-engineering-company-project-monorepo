[project]
name = "incidents-api"
version = "0.1.0"
description = "TrackFlow incidents and suppliers API utilities"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "PyJWT>=2.9.0,<3.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "tinydb>=4.8.0,<5.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "sqlmodel>=0.0.39",
    "psycopg2-binary>=2.9.12",
    "pandas>=2.2.0,<3.0.0",
    "celery[redis]>=5.4.0,<6.0.0",
    # Dependencias de data/pipelines/rfp_intake (Hito 9 Parte 1,
    # CONTEXT9.md): este servicio solo importa y dispara el grafo
    # (`rfp_pipeline_path.py` + `routers/rfp.py` + `rfp_tasks.py`), nunca
    # contiene su lógica -- pero corre en el mismo proceso, mismo
    # trade-off que langgraph/qdrant-client/openai en
    # services/knowledge-api/pyproject.toml para data/pipelines/rag.py.
    "langgraph>=1.2.12",
    "markitdown[pdf]>=0.1.0",
    "py-readability-metrics>=1.4.5",
    "langgraph-checkpoint-postgres>=3.2.0",
]

[dependency-groups]
# Tests del endpoint SSE (tests/services/) -- corren contra este venv porque
# importan el servicio real (auth_service, routers/rfp_events.py).
dev = ["pytest>=8.0.0"]

[project.scripts]
seed = "seed:main"

[tool.setuptools]
py-modules = [
    "auth_service",
    "celery_app",
    "database",
    "main",
    "models",
    "schemas",
    "seed",
    "task_dlq",
    "tasks",
    "user_service",
    "rfp_pipeline_path",
    "rfp_tasks",
]
packages = ["routers", "telemetry"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
