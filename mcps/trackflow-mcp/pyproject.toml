[project]
name = "trackflow-mcp"
version = "0.1.0"
description = "MCP Server de TrackFlow: tools sobre el Incidents Manager e inventario, protegido con OAuth 2.1/OIDC via MCP Auth."
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.0,<5.0.0",
    "mcpauth>=0.1.1,<0.2.0",
    "httpx>=0.28.1,<1.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pyjwt[crypto]>=2.9.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "anyio>=4.0.0,<5.0.0",
]

[tool.setuptools]
py-modules = ["server", "auth", "scopes", "backend_client", "logging_middleware"]
packages = ["tools"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
